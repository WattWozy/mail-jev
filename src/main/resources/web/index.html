<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>Mail Sorter</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 980px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #181a1d;
            color: #d4d7dd;
        }
        fieldset {
            margin-bottom: 1rem;
            border: 1px solid #30343b;
            border-radius: 6px;
            background: #1e2126;
        }
        legend { color: #9ea4b0; }
        label { display: inline-block; margin: .25rem .75rem .25rem 0; }
        input, select, button {
            background: #252930;
            color: #e2e5eb;
            border: 1px solid #3a3f48;
            border-radius: 4px;
            padding: .3rem .5rem;
        }
        button { cursor: pointer; }
        button:hover:not(:disabled) { background: #2f343d; border-color: #4c5360; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border-bottom: 1px solid #2b2f36; padding: .4rem; text-align: left; font-size: .9rem; }
        th { color: #9ea4b0; }
        tr:hover td { background: #1e2126; }
        .badge { padding: .1rem .55rem; border-radius: .7rem; font-size: .8rem; color: #f4f6f8; white-space: nowrap; }
        .ARCHIVE { background: #1f7a63; } .MOVE_TO_TRASH { background: #b83b32; }
        .KEEP { background: #4a5565; } .FLAG_FOR_REVIEW { background: #b87408; }
        .err { color: #f26d6d; }
        .ok  { color: #4ade80; }
        #summary span { margin-right: 1rem; }
        .custom-only { display: none; }

        /* Spinner */
        #spinner {
            display: none;
            align-items: center;
            gap: .6rem;
            margin: .75rem 0;
            color: #9ea4b0;
            font-size: .95rem;
        }
        #spinner.visible { display: flex; }
        .spinner-ring {
            width: 18px;
            height: 18px;
            border: 2px solid #3a3f48;
            border-top-color: #6b9fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<h1>Mail Sorter</h1>

<fieldset>
    <legend>1. Connect</legend>

    <label>Provider
        <select id="provider">
            <option value="gmail">Gmail</option>
            <option value="gmx">GMX</option>
            <option value="outlook">Outlook / Office 365</option>
            <option value="yahoo">Yahoo</option>
            <option value="icloud">iCloud</option>
            <option value="">Custom</option>
        </select>
    </label>

    <label class="custom-only">Host <input id="host" value="127.0.0.1"></label>
    <label class="custom-only">Port <input id="port" type="number" value="3143" size="5"></label>
    <label>User <input id="user" value=""></label>
    <label>Password <input id="pass" type="password" value=""></label>
    <label class="custom-only"><input id="ssl" type="checkbox"> SSL</label>

    <button id="connect">Connect</button>
</fieldset>

<fieldset>
    <legend>2. Classify</legend>
    <label>Batch size <input id="limit" type="number" value="25" size="4"></label>
    <button id="preview" disabled>Preview (changes nothing)</button>
    <button id="apply" disabled>Apply to mailbox</button>
</fieldset>

<div id="spinner">
    <div class="spinner-ring"></div>
    <span id="spinner-text">Working…</span>
</div>

<p id="msg"></p>
<div id="summary"></div>
<table>
    <thead><tr><th>From</th><th>Subject</th><th>Category</th><th>Conf.</th><th>Action</th><th>Reason</th></tr></thead>
    <tbody id="rows"></tbody>
</table>

<script>
    const $ = id => document.getElementById(id);

    const providers = {
        gmx:     { host: 'imap.gmx.com',     port: 993, ssl: true },
        gmail:   { host: 'imap.gmail.com',   port: 993, ssl: true },
        outlook: { host: 'outlook.office365.com', port: 993, ssl: true },
        yahoo:   { host: 'imap.mail.yahoo.com', port: 993, ssl: true },
        icloud:  { host: 'imap.mail.me.com', port: 993, ssl: true },
    };

    function updateCustomVisibility() {
        const isCustom = !$('provider').value;
        document.querySelectorAll('.custom-only').forEach(el => {
            el.style.display = isCustom ? 'inline-block' : 'none';
        });
    }

    $('provider').onchange = () => {
        const p = providers[$('provider').value];
        if (p) {
            $('host').value = p.host;
            $('port').value = p.port;
            $('ssl').checked = p.ssl;
        }
        updateCustomVisibility();
    };

    updateCustomVisibility();

    // ---- loading / spinner helpers ----
    function setLoading(on, text = 'Working…') {
        $('spinner').classList.toggle('visible', on);
        $('spinner-text').textContent = text;
        $('connect').disabled = on;
        $('preview').disabled = on || !$('preview').dataset.enabled;
        $('apply').disabled = on || !$('apply').dataset.enabled;
    }

    // keep track of which buttons are actually allowed
    function enablePreview(ok) {
        $('preview').dataset.enabled = ok ? '1' : '';
        if (!ok) $('preview').disabled = true;
    }
    function enableApply(ok) {
        $('apply').dataset.enabled = ok ? '1' : '';
        if (!ok) $('apply').disabled = true;
    }

    async function api(path, body) {
        const res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        return data;
    }

    function show(text, isError = false) {
        $('msg').textContent = text;
        $('msg').className = isError ? 'err' : (text === 'Connected.' ? 'ok' : '');
    }

    function cell(row, text) {
        const td = document.createElement('td');
        td.textContent = text;
        row.appendChild(td);
        return td;
    }

    function render(report) {
        $('summary').replaceChildren(...Object.entries(report.counts).map(([action, n]) => {
            const s = document.createElement('span');
            s.textContent = action + ': ' + n;
            return s;
        }));
        $('rows').replaceChildren(...report.entries.map(e => {
            const tr = document.createElement('tr');
            cell(tr, e.from);
            cell(tr, e.subject);
            cell(tr, e.category);
            cell(tr, Math.round(e.confidence * 100) + '%');
            const badge = document.createElement('span');
            badge.className = 'badge ' + e.action;
            badge.textContent = e.action;
            cell(tr, '').appendChild(badge);
            cell(tr, e.reason);
            return tr;
        }));
    }

    $('connect').onclick = async () => {
        setLoading(true, 'Connecting…');
        show('');
        try {
            const provider = $('provider').value;
            const body = {
                provider: provider,
                username: $('user').value,
                secret: $('pass').value
            };

            if (!provider) {
                body.host = $('host').value;
                body.port = +$('port').value;
                body.ssl  = String($('ssl').checked);
            }

            await api('/api/connect', body);
            show('Connected.');
            enablePreview(true);
            enableApply(false);
        } catch (e) {
            show(e.message, true);
            enablePreview(false);
            enableApply(false);
        } finally {
            setLoading(false);
        }
    };

    async function run(apply) {
        setLoading(true, apply ? 'Applying changes…' : 'Classifying…');
        show('');
        try {
            const report = await api('/api/classify', {
                limit: +$('limit').value,
                apply
            });
            render(report);
            show(apply
                ? 'Applied. Run a new preview to see what is left.'
                : 'Preview only: nothing was changed in the mailbox.');
            enableApply(!apply && report.entries.length > 0);
        } catch (e) {
            show(e.message, true);
        } finally {
            setLoading(false);
        }
    }

    $('preview').onclick = () => run(false);
    $('apply').onclick = () => {
        if (confirm('Move and archive mail as shown?')) run(true);
    };
</script>
</body>
</html>
